<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0e12">
  <title>golem — pair this screen</title>
  <link rel="icon" href="icons/favicon-180.png?v=2">
  <!-- docs/devices-people.md, lot C : le premier écran d'un rack sans écran. Le code (six chiffres, 10 min,
       usage unique) vient de `golem pair` sur le rack, ou de Settings ▸ Connect ▸ Devices sur un écran admin.
       Page AUTONOME : pas de lib.js (sa garde « jeton inconnu » renverrait ici un appareil déjà refusé). -->
  <style>
    :root{color-scheme:dark}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0c0e12;color:#e8ecf1;
      font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px;box-sizing:border-box}
    main{max-width:440px;width:100%;display:flex;flex-direction:column;gap:16px}
    .mk{font:700 18px ui-monospace,monospace}.mk span{color:#ff5a3c}
    h1{margin:0;font-size:26px;line-height:1.2}
    p{margin:0;color:#9aa4b1}
    label{font:700 11px ui-monospace,monospace;letter-spacing:.08em;color:#9aa4b1;text-transform:uppercase}
    input{font:800 40px ui-monospace,monospace;letter-spacing:.3em;text-align:center;width:100%;box-sizing:border-box;
      padding:14px 10px;border-radius:14px;border:2px solid #232b35;background:#12161c;color:#fff}
    input:focus{outline:none;border-color:#ff5a3c}
    button{min-height:52px;border:0;border-radius:14px;background:#ff5a3c;color:#fff;font:700 17px system-ui,sans-serif;cursor:pointer}
    button:disabled{opacity:.45}
    .msg{min-height:22px;font-weight:600}
    .msg.err{color:#ff8a80}.msg.ok{color:#8fe2b1}
    code{color:#e8ecf1}
  </style>
</head>
<body>
  <main>
    <div class="mk"><span>/</span>golem_</div>
    <h1>Make this tablet the rack's screen</h1>
    <p id="state">Enter the six-digit code the rack shows with <code>golem pair</code>. It is valid 10 minutes, for one device.</p>
    <label for="code">Pairing code</label>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······" autofocus>
    <button id="go" disabled>Pair this screen</button>
    <div id="msg" class="msg"></div>
  </main>
  <script>
    const code = document.getElementById('code'), go = document.getElementById('go'), msg = document.getElementById('msg');
    fetch('/api/auth/pair').then(r => r.json()).then(d => {
      if (!d.pending) document.getElementById('state').innerHTML = 'No code is waiting on the rack. On the rack, run <code>golem pair</code>, or on an admin screen open <b>Settings ▸ Connect ▸ Devices</b>.';
    }).catch(() => {});
    code.addEventListener('input', () => { code.value = code.value.replace(/\D/g, '').slice(0, 6); go.disabled = code.value.length !== 6; msg.textContent = ''; });
    const pair = async () => {
      go.disabled = true; msg.className = 'msg'; msg.textContent = 'Pairing…';
      try {
        const r = await fetch('/api/auth/pair', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: code.value }) });
        const d = await r.json();
        if (!r.ok || !d.token) throw new Error(d.error || 'wrong or expired code');
        localStorage.setItem('golem_token', d.token);
        document.cookie = 'golem_token=' + d.token + '; path=/; SameSite=Lax; max-age=31536000';
        msg.className = 'msg ok'; msg.textContent = '✓ This tablet is the rack screen.';
        setTimeout(() => location.replace('/app/'), 700);
      } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; go.disabled = code.value.length !== 6; }
    };
    go.addEventListener('click', pair);
    code.addEventListener('keydown', e => { if (e.key === 'Enter' && code.value.length === 6) pair(); });
  </script>
</body>
</html>
